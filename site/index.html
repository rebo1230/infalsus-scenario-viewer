  }

  // IntroVideoKey = 1 + state*3 + time; states follow the video file names (01 Stable … 10 Needling),
  // labels come from the game's Story_IntroVideo_* strings in the generated data (D.rmi)
  const SKY_STATES = ['Stable', 'Thin', 'Dense', 'Islands', 'Shifting', 'Low Visibility', 'Splitting', 'Scattered', 'Needling']
    .map((file, i) => [file, D.rmi?.states?.[i]]);
  const SKY_TIMES = [['Dawndusk', '새벽·저녁'], ['Day', '낮'], ['Night', '밤']];
  const rmiText = x => (x && (x[primary()] || x.ko || x.en)) || '';
  function introVideo(k) {
    if (!k) return null;
    const st = SKY_STATES[Math.floor((k - 1) / 3)], tm = SKY_TIMES[(k - 1) % 3];
    const label = `${rmiText(D.rmi?.label) || 'RMI'} ${st ? rmiText(st[1]) || st[0] : ''}`;
    return {
      cap: st ? `${label} · ${tm[1]}` : `키 ${k}`,
      state: st ? label : `키 ${k}`,
      file: st ? `${String(Math.floor((k - 1) / 3) + (k > 9 ? 2 : 1)).padStart(2, '0')} ${st[0]} ${tm[0]}` : '',
    };
  }
  // shown above the first line of the script, like the game's opening: the intro video (RMI 분포),
  // then the time slot and date (only where the game shows its clock, CanShowClock)
  function introVideoHtml(e) {
    const v = introVideo(e.video);
    const rows = [];
    if (v) rows.push(`<div class="scene-row"><span class="scene-cap">${esc(v.state)}</span></div>`);
    if (e.clock) rows.push(`<div class="scene-row intro-date"><span class="scene-cap">${esc(D.slots[e.slot])} · <span class="mono">${yr(e.y)}/${e.m}/${e.d}</span></span></div>`);
    return rows.length ? `<div class="scene intro">${rows.join('')}</div>` : '';
  }

  function detailHtml(e) {
    const id = e.id;
    const bits = { y: id >>> 28, m: (id >> 24) & 15, d: (id >> 19) & 31, slot: (id >> 15) & 15, num: (id >> 11) & 15, ch: (id >> 3) & 31, f: id & 7 };
    const req = e.req.map(chip).join('') || '<span class="note">없음 (처음부터 열림)</span>';
    const unl = (unlocks.get(e.c) || []).map(chip).join('') || '<span class="note">없음</span>';
    const counts = new Map(); let narr = 0;
    for (const l of e.lines) { if (l[2] === 'n') narr++; else if (l[1]) counts.set(l[1], (counts.get(l[1]) || 0) + 1); }
    const top = [...counts].sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, narr, ...top.map(t => t[1]));
    const bar = (label, n, color) => `<span style="${color ? '--spk:' + color : ''}">${esc(label)}</span><span class="bar" style="${color ? '--spk:' + color : ''}"><i style="width:${(n / max) * 100}%"></i></span><span class="n">${n}</span>`;
    return `
      <div class="dsec"><h3>기본 정보</h3><dl class="dl">
        <dt>챕터</dt><dd>${esc(chTitle(e.ch, primary()))} <span class="mono">(${e.ch})</span></dd>
        <dt>작중 일시</dt><dd>${yr(e.y)}년 ${e.m}월 ${e.d}일 ·${e.slot} ${esc(D.slots[e.slot])}</dd>
        <dt>시점</dt><dd>${esc(povName(e, 'ko'))} <span class="mono">(${e.lane})</span></dd>
        <dt>순서</dt><dd>시간순 #${e.c} · 플레이순 #${e.p}</dd>
        <dt>ID</dt><dd><span class="mono">${esc(e.story)}</span> (대사 ID 앞자리)</dd>
        <dt>스크립트 파일</dt><dd><span class="mono">${esc(e.file)}.sps</span></dd>
        <dt>도입 영상</dt><dd>${(v => v ? `${esc(v.cap)} <span class="note">(키 ${e.video} · 영상 <span class="mono">${esc(v.file)}</span>)</span>` : '<span class="note">없음</span>')(introVideo(e.video))}</dd>
      </dl></div>
      <div class="dsec"><h3>별도 표기</h3><dl class="dl">
        <dt>-O 표기</dt><dd>${e.o ? '있음 — 파일명에 <span class="mono">-O</span>, 식별자 플래그 4' : '없음'}</dd>
      </dl><div class="note">O 표기의 의미는 게임 데이터에 적혀 있지 않습니다.</div></div>
      <div class="dsec"><h3>해금 조건</h3><dl class="dl">
        <dt>먼저 읽어야 할 에피소드</dt><dd><div class="chips">${req}</div></dd>
        <dt>곡 플레이 · 조우</dt><dd>${songHtml(e)}</dd>
        <dt>이 에피소드가 여는 것</dt><dd><div class="chips">${unl}</div></dd>
      </dl><div class="note">출처: StoryDetails.orderedStoryEntryUnlockRequirements / SongPlayRequirements / EncounterRequirements</div></div>
      ${imgDetailHtml(e)}
      ${cgDetailHtml(e)}
      ${window.IFMemo ? window.IFMemo.detailHtml(e) : ''}
      <div class="dsec"><h3>대사 통계 — 총 ${e.lines.length}줄</h3><div class="bars">
        ${narr ? bar(`${povName(e, 'ko')} (서술)`.trim(), narr, LANE_COLOR[e.lane]) : ''}
        ${top.map(([s, n]) => bar(spkName(s, 'ko'), n, SPEAKER_COLOR[s])).join('')}
      </div></div>
      <div class="dsec"><h3>식별자 (StoryIdentifier)</h3><dl class="dl">
        <dt>값</dt><dd class="mono">${id} · 0x${id.toString(16).toUpperCase()}</dd>
      </dl>
      <table class="bits"><tr><th>연 (28~)</th><th>월 (24~27)</th><th>일 (19~23)</th><th>시간대 (15~18)</th><th>번호 (11~14)</th><th>시점 (3~7)</th><th>플래그 (0~2)</th></tr>
      <tr><td>${bits.y}</td><td>${bits.m}</td><td>${bits.d}</td><td>${bits.slot} (${String.fromCharCode(65 + bits.slot)})</td><td>${bits.num}</td><td>${bits.ch} (${e.lane})</td><td>${bits.f}${bits.f === 4 ? ' (-O)' : ''}</td></tr></table></div>`;
  }

  function closeReader() {
    if ($('reader').classList.contains('full')) toggleFull();
    $('reader').classList.remove('open'); $('reader').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('open');
    state.open = null; history.replaceState(null, '', location.pathname);
    document.querySelectorAll('.node.current').forEach(n => n.classList.remove('current'));
    window.IFMemo?.readerClosed?.();
  }

  function toggleFull() {
    const r = $('reader'), on = !r.classList.contains('full');
    r.classList.toggle('full', on);
    // fills the browser window (not the monitor): the app frame drops its margin while reading full
    $('app').classList.toggle('app-full', on);
    $('scrim').classList.toggle('open', !on && r.classList.contains('open'));
    if (state.open) renderReader();
    if (state.view === 'timeline') requestAnimationFrame(buildTimeline);
  }

  /* ================= data view (all lines in ID order) ================= */
  const byStory = [...eps].filter(e => e.lines.length).sort((a, b) => a.story.localeCompare(b.story));
  let dataBuilt = false, io = null;

  // filters: chapter, speaker (script name key), type (s / n / m = messenger left+right / l)
  const dFilter = { ch: '', spk: '', type: '', ann: false };
  const TOTAL_LINES = byStory.reduce((n, e) => n + e.lines.length, 0);
  const spkCounts = (() => { const m = new Map(); for (const e of byStory) for (const l of e.lines) if (l[1]) m.set(l[1], (m.get(l[1]) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); })();
  const lineMatches = (e, l) => (!dFilter.ch || e.ch === dFilter.ch)
    && (!dFilter.ann || !!window.IFMemo?.lineHasAnn(l[0]))
    && (!dFilter.type || (dFilter.type === 'm' ? (l[2] === 'ml' || l[2] === 'mr') : l[2] === dFilter.type))
    && (!dFilter.spk || l[1] === dFilter.spk);
  const filteredLines = e => e.lines.filter(l => lineMatches(e, l));

  function buildFilterOptions() {
    $('fCh').innerHTML = '<option value="">전체</option>' + D.chapters.map(c => `<option value="${c.key}">${esc(chTitle(c.key, primary()))}</option>`).join('');
    $('fSpk').innerHTML = '<option value="">전체</option>' + spkCounts.map(([k, n]) => `<option value="${esc(k)}">${esc(spkName(k, primary()))} (${n})</option>`).join('');
    $('fCh').value = dFilter.ch; $('fSpk').value = dFilter.spk; $('fType').value = dFilter.type;
  }
  function buildData() {
    buildFilterOptions();
    resetDataSections();
    dataBuilt = true;
  }
  function resetDataSections() {
    io?.disconnect();
    if (dataBuilt) buildFilterOptions();   // speaker / chapter names follow the primary language
    const per = 26 + 20 * (state.langs.length - 1);
    const shown = byStory.map(e => [e, filteredLines(e).length]).filter(([, n]) => n);
    const lineCount = shown.reduce((s, [, n]) => s + n, 0);
    const filtered = dFilter.ch || dFilter.spk || dFilter.type || dFilter.ann;
    $('dInfo').textContent = `ID ${shown.length}개 · ${lineCount.toLocaleString()}줄${filtered ? ` 표시 (전체 ${TOTAL_LINES.toLocaleString()}줄)` : ''} · ID 순`;
    $('dStory').innerHTML = shown.map(([e]) => `<option value="${e.story}">${esc(joinDot(e.story, `${e.m}/${e.d} ${D.slots[e.slot]}`, povName(e, 'ko')))}</option>`).join('');
    $('dList').innerHTML = shown.length ? shown.map(([e, n]) => `<section class="dstory" id="S${e.story}" data-c="${e.c}" style="--lane:${LANE_COLOR[e.lane]}">
      <h4><span class="sn">${e.story}</span><span class="pv">${esc(povName(e, primary()))}</span>
      <span class="m">${yr(e.y)}년 ${e.m}/${e.d} ${e.slot} ${esc(D.slots[e.slot])} · ${esc(e.file)} · ${filtered ? `${n}/${e.lines.length}` : e.lines.length}줄 · 시간순 #${e.c}</span></h4>
      <div class="drows" style="min-height:${n * per}px"></div></section>`).join('')
      : '<div class="empty">조건에 맞는 대사가 없습니다.</div>';
    io = new IntersectionObserver(entries => {
      for (const en of entries) if (en.isIntersecting) { fillSection(en.target); io.unobserve(en.target); }
    }, { root: $('dList'), rootMargin: '1200px 0px' });
    $('dList').querySelectorAll('.dstory').forEach(s => io.observe(s));
  }
  function fillSection(sec) {
    const e = byChrono.get(+sec.dataset.c), box = sec.querySelector('.drows');
    if (box.dataset.done) return;
    box.innerHTML = filteredLines(e).map(l => {
      const color = SPEAKER_COLOR[l[1]] ? `--spk:${SPEAKER_COLOR[l[1]]}` : '';
      const who = l[2] === 'n' ? `(${esc(`${povName(e, primary())} 서술`.trim())})` : l[2] === 'l' ? '(로그)' : esc(spkName(l[1], primary()));
      const tx = state.langs.map(k => `<div data-l="${LANG_TAG[k]}">${rich(l[TEXT_IDX[k]] || '')}</div>`).join('');
      return `<div class="drow" id="D${l[0]}" style="${color}"><button class="did" data-c="${e.c}" data-l="${l[0]}" title="대본에서 열기">${l[0]}</button>
        <span class="dt" title="${TYPE_NAME[l[2]]}">${l[2]}</span><span class="da">${esc(l[8] || '')}</span><span class="ds">${who}</span><div class="dx">${tx}</div></div>`;
    }).join('');
    box.style.minHeight = ''; box.dataset.done = '1';
  }
  function gotoData(lineOrStory) {
    const story = lineOrStory.slice(0, 3), sec = $('S' + story); if (!sec) return false;
    fillSection(sec);
    const target = lineOrStory.length > 3 ? $('D' + lineOrStory) : sec;
    if (!target) return false;
    // sections above fill in lazily and change height, so re-align a few times
    const align = () => { const list = $('dList'); list.scrollTop += target.getBoundingClientRect().top - list.getBoundingClientRect().top - (target === sec ? 0 : 40); };
    align(); setTimeout(align, 60); setTimeout(align, 250);
    if (target !== sec) { target.classList.add('flash'); setTimeout(() => target.classList.remove('flash'), 1600); }
    return true;
  }

  /* ================= data view: image catalog ================= */
  let imgsBuilt = false;
  function imageCatalog() {
    const map = new Map();   // "kind:key" -> {kind, key, uses: [{e, line}]}
    const add = (kind, key, e, line) => {
      const id = `${kind}:${key}`;
      if (!map.has(id)) map.set(id, { kind, key, uses: [] });
      const it = map.get(id);
      if (!it.uses.some(u => u.e === e && u.line === line)) it.uses.push({ e, line });
    };
    for (const e of eps) {
      for (const g of e.cg || []) for (const n of g.imgs) add('cg', n, e, e.lines[g.pos]?.[0] || null);
      if (e.img) {
        for (const [id, keys] of Object.entries(e.img.lines)) for (const k of keys) add('text', k, e, id);
        for (const b of e.img.blocks) for (const k of b.layers || []) add('text', k, e, e.lines[b.pos]?.[0] || null);
      }
      if (e.song && D.songs[e.song]) add('jacket', e.song, e, null);
    }
    return [...map.values()];   // eps are in chronological order, so first use comes first
  }
  const KIND_NAME = { cg: 'CG', text: '연출 이미지', jacket: '곡 자켓' };
  function imgCardHtml(it) {
    const src = it.kind === 'cg' ? cgSrc(it.key) : it.kind === 'text' ? imgSrc(it.key) : D.songs[it.key].jacket;
    const title = it.kind === 'jacket' ? `${name(D.songs[it.key].title, primary())} — ${name(D.songs[it.key].artist, primary())}` : it.key;
    const uses = it.uses.map(u => `<button class="iuse" data-c="${u.e.c}" ${u.line ? `data-l="${u.line}"` : ''} style="--lane:${LANE_COLOR[u.e.lane]}">
      #${u.e.c} ${u.e.m}/${u.e.d} ${esc(D.slots[u.e.slot])}${povName(u.e, 'ko') ? ` · <b>${esc(povName(u.e, 'ko'))}</b>` : ''}${u.line ? ` · <span class="mono">${u.line}</span>` : ''}</button>`).join('');
    return `<figure class="icard ${it.kind}">
      <button class="ithumb" data-kind="${it.kind}" data-key="${esc(it.key)}" aria-label="${esc(title)} 크게 보기"><img src="${esc(src)}" alt="" loading="lazy"></button>
      <figcaption><span class="ikind">${KIND_NAME[it.kind]}</span> <span class="iname">${esc(title)}</span><div class="iuses">${uses}</div></figcaption></figure>`;
  }
  function renderImages() {
    const all = imageCatalog(), kind = $('iKind').value;
    const list = all.filter(it => !kind || it.kind === kind);
    const counts = Object.keys(KIND_NAME).map(k => `${KIND_NAME[k]} ${all.filter(it => it.kind === k).length}`).join(' · ');
    $('iInfo').textContent = `${list.length}개 표시 (${counts}) · 처음 나오는 순`;
    $('dImgs').innerHTML = `<div class="igrid">${list.map(imgCardHtml).join('')}</div>`;
    imgsBuilt = true;
  }
  // sub-tabs of the data view; 'anns' (annotations) and 'terms' are added by memo.js
  function setDataTab(t) {
    const imgs = t === 'imgs', anns = t === 'anns', terms = t === 'terms';
    $('dtLines').setAttribute('aria-selected', String(t === 'lines')); $('dtImgs').setAttribute('aria-selected', String(imgs));
    $('dtAnns')?.setAttribute('aria-selected', String(anns));
    $('dtTerms')?.setAttribute('aria-selected', String(terms));
    $('dLineBar').hidden = $('dList').hidden = t !== 'lines';
    $('dImgBar').hidden = $('dImgs').hidden = !imgs;
    if ($('dAnns')) $('dAnnBar').hidden = $('dAnns').hidden = !anns;
    if ($('dTerms')) $('dTermBar').hidden = $('dTerms').hidden = !terms;
    if (imgs && !imgsBuilt) renderImages();
    if (anns) window.IFMemo?.renderAnnList();
    if (terms) window.IFMemo?.renderTermList();
    if (t === 'lines' && dataBuilt) resetDataSections();   // annotation filter may have changed
  }

  function setView(v) {
    state.view = v;
    $('viewTimeline').hidden = v !== 'timeline'; $('viewData').hidden = v !== 'data';
    $('chSeg').hidden = $('moSeg').hidden = v !== 'timeline';
    $('tabTimeline').setAttribute('aria-selected', String(v === 'timeline'));
    $('tabData').setAttribute('aria-selected', String(v === 'data'));
    if (v === 'data' && !dataBuilt) buildData();
    if (v === 'timeline') buildTimeline();
  }

  /* ================= search ================= */
  // text a query can match: the base text (ruby readings dropped), the text read aloud
  // (ruby bases replaced by their readings) and both joined, each with line breaks removed or turned into spaces
  function searchForms(raw) {
    const base = plain(raw);
    const reading = String(raw).replace(/<ruby>(.*?)<\/ruby>/gs, (m, inner) => (inner.match(/<rt>(.*?)<\/rt>/gs) || []).map(r => r.slice(4, -5)).join('') || inner)
      .replace(/<[^>]+>/g, '');
    const both = String(raw).replace(/<[^>]+>/g, '');   // base + reading, as text copied from the screen reads
    return [base, reading, both].flatMap(t => [t.replace(/\n/g, ''), t.replace(/\n/g, ' ')]).map(t => t.toLowerCase());
  }
  // highlight the query inside already-rendered rich text (works in ruby bases and readings)
  function markText(root, ql) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      const t = n.nodeValue, i = t.toLowerCase().indexOf(ql);
      if (i < 0) continue;
      const m = document.createElement('mark'); m.textContent = t.slice(i, i + ql.length);
      const after = n.splitText(i); after.nodeValue = after.nodeValue.slice(ql.length);
      n.parentNode.insertBefore(m, after);
    }
    // a match spanning a ruby's base and reading: highlight the whole ruby
    if (!root.querySelector('mark')) root.querySelectorAll('ruby').forEach(r => { if (ql.includes(r.textContent.toLowerCase())) r.classList.add('hit-ruby'); });
  }

  function search(q) {
    const box = $('results'); q = q.trim();
    if (!q) { box.classList.remove('open'); return; }
    const ql = q.toLowerCase(), hits = [];
    outer: for (const e of eps) for (const l of e.lines) {
      for (const k of state.langs) {
        const raw = l[TEXT_IDX[k]] || '';
        if (searchForms(raw).some(t => t.includes(ql))) { hits.push([e, l, raw]); if (hits.length >= 300) break outer; break; }
      }
    }
    const memoHits = window.IFMemo ? window.IFMemo.searchHtml(q) : '';   // notes and annotations first
    box.innerHTML = `<div class="rhead"><span>“${esc(q)}” — ${hits.length >= 300 ? '300+' : hits.length}건 (${state.langs.map(k => LANG_TAG[k]).join('·')})</span><button id="resClose" aria-label="닫기">×</button></div>` + memoHits +
      (hits.length ? hits.map(([e, l, t]) => `<button class="res" data-c="${e.c}" data-l="${l[0]}" style="--lane:${LANE_COLOR[e.lane]}">
        <div class="rm">${e.m}/${e.d} ${esc(D.slots[e.slot])}${povName(e, primary()) ? ` · <b>${esc(povName(e, primary()))}</b>` : ''} · ${l[0]}${l[1] ? ' · ' + esc(spkName(l[1], primary())) : ''}</div>
        <div class="rt">${rich(t)}</div></button>`).join('') : memoHits ? '' : '<div class="empty">결과 없음</div>');
    box.querySelectorAll('.rt').forEach(el => markText(el, ql));
    box.classList.add('open');
    $('resClose').onclick = () => box.classList.remove('open');
  }

  /* ================= wiring ================= */
  $('langs').innerHTML += LANG_ORDER.map(k => `<label data-lang="${k}"><input type="checkbox" value="${k}" ${state.langs.includes(k) ? 'checked' : ''} ${LANG_OK.includes(k) ? '' : 'disabled'} aria-label="${LANG_NAME[k]}"><span>${LANG_BTN[k]}</span></label>`).join('');
  // mark the primary language (speaker names, search snippets and images follow it)
  const syncLangChips = () => $('langs').querySelectorAll('label').forEach(l => {
    const k = l.dataset.lang, p = k === primary();
    l.classList.toggle('primary', p);
    l.title = !LANG_OK.includes(k) ? `${LANG_NAME[k]} 없음${k === 'ko' ? ' — 게임에 한국어 패치를 설치한 뒤 rebuild.bat을 실행하세요' : ''}`
      : `${LANG_NAME[k]}${p ? ' (대표 언어)' : state.langs.includes(k) ? ' (병기)' : ''}`;
  });
  syncLangChips();
  $('langs').addEventListener('change', ev => {
    const picked = LANG_ORDER.filter(k => $('langs').querySelector(`input[value="${k}"]`).checked);
    if (!picked.length) { ev.target.checked = true; return; }   // at least one language
    // keep the order the user ticked them in, so the first ticked stays primary
    state.langs = state.langs.filter(k => picked.includes(k)).concat(picked.filter(k => !state.langs.includes(k)));
    store.set('langs', state.langs);
    syncLangChips();
    if (state.view === 'timeline') buildTimeline();
    if (dataBuilt) resetDataSections();
    if (imgsBuilt) { if ($('dImgs').hidden) imgsBuilt = false; else renderImages(); }
    if (state.open) renderReader();
    if ($('results').classList.contains('open')) search($('q').value);
  });
  if (!ORDERS[state.order]) state.order = 'play';

  $('tabTimeline').onclick = () => setView('timeline');
  $('tabData').onclick = () => setView('data');
  $('canvas').addEventListener('click', ev => { const n = ev.target.closest('.node'); if (n) openEpisode(+n.dataset.c); });
  $('dList').addEventListener('click', ev => { const b = ev.target.closest('.did'); if (b) openEpisode(+b.dataset.c, b.dataset.l, 'script'); });
  $('results').addEventListener('click', ev => {
    const r = ev.target.closest('.res'); if (!r || !r.dataset.c) return;   // memo results handle themselves
    $('results').classList.remove('open');
    if (state.view === 'data') gotoData(r.dataset.l); else openEpisode(+r.dataset.c, r.dataset.l, 'script');
  });
  $('scrim').onclick = closeReader;
  $('chPrev').onclick = () => jumpRel(tl.chapters, 'ci', -1);
  $('chNext').onclick = () => jumpRel(tl.chapters, 'ci', 1);
  $('moPrev').onclick = () => jumpRel(tl.months, 'mi', -1);
  $('moNext').onclick = () => jumpRel(tl.months, 'mi', 1);
  $('scroller').addEventListener('scroll', onScroll, { passive: true });
  // mouse wheel always moves the timeline sideways (lanes are sized to fit the height)
  $('scroller').addEventListener('wheel', ev => {
    if (ev.ctrlKey) return;
    const d = Math.abs(ev.deltaY) >= Math.abs(ev.deltaX) ? ev.deltaY : ev.deltaX;
    if (!d) return;
    ev.preventDefault();
    $('scroller').scrollLeft += ev.deltaMode === 1 ? d * 40 : d;
  }, { passive: false });
  $('dStory').onchange = () => gotoData($('dStory').value);
  $('dtLines').onclick = () => setDataTab('lines');
  $('dtImgs').onclick = () => setDataTab('imgs');
  $('iKind').onchange = renderImages;
  $('dImgs').addEventListener('click', ev => {
    const u = ev.target.closest('.iuse');
    if (u) return openEpisode(+u.dataset.c, u.dataset.l, 'script');
    const t = ev.target.closest('.ithumb'); if (!t) return;
    if (t.dataset.kind === 'cg') showCg([t.dataset.key], false);
    else if (t.dataset.kind === 'text') showImages([t.dataset.key], '', false);
    else showJacket(t.dataset.key);
  });
  const onFilter = () => { dFilter.ch = $('fCh').value; dFilter.spk = $('fSpk').value; dFilter.type = $('fType').value; dFilter.ann = $('fAnn').checked; resetDataSections(); $('dList').scrollTop = 0; };
  ['fCh', 'fSpk', 'fType', 'fAnn'].forEach(id => $(id).onchange = onFilter);
  $('fReset').onclick = () => { dFilter.ch = dFilter.spk = dFilter.type = ''; $('fAnn').checked = false; buildFilterOptions(); onFilter(); };
  $('dId').addEventListener('keydown', ev => { if (ev.key === 'Enter') { const v = $('dId').value.trim(); if (!gotoData(v)) $('dId').select(); } });
  $('q').addEventListener('keydown', ev => { if (ev.key === 'Enter') search($('q').value); if (ev.key === 'Escape') $('results').classList.remove('open'); });
  document.addEventListener('keydown', ev => {
    if (ev.target.matches('input, select')) return;
    if (ev.key === 'Escape') {
      const lb = document.querySelector('.lightbox');
      if (lb) lb.remove();
      else if ($('results').classList.contains('open')) $('results').classList.remove('open');
      else if ($('reader').classList.contains('full')) toggleFull();
      else if (state.open) closeReader();
    }
    if (!state.open) return;
    if (ev.key === 'ArrowRight') $('rNext')?.click();
    if (ev.key === 'ArrowLeft') $('rPrev')?.click();
    if (ev.key === 'f' || ev.key === 'F') toggleFull();
  });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (state.view === 'timeline') buildTimeline(); }, 120); });

  // shared with memo.js (notes / annotations / terms)
  window.IFV = {
    D, eps, byChrono, state, esc, rich, plain, name, spkName, povName, chTitle, primary,
    TEXT_IDX, LANG_ORDER, LANG_TAG, LANG_NAME, LANE_COLOR, SPEAKER_COLOR,
    openEpisode, renderReader: () => state.open && renderReader(), setDataTab,
    refreshData: () => { if (dataBuilt) resetDataSections(); },
    epLabel: e => `#${e.c} ${e.m}/${e.d} ${D.slots[e.slot]}${povName(e, 'ko') ? ' · ' + povName(e, 'ko') : ''}`,
  };

  buildTimeline();
  const m = location.hash.match(/ep=(\d+)(?:&line=([\w-]+))?/);
  if (m) openEpisode(+m[1], m[2]);
})();
</script>
<script src="memo.js"></script>

(() => {
  const KEY = 'ifv.notice';

  const el = document.createElement('div');
  el.className = 'notice'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'noticeTitle');
  el.innerHTML = `<div class="notice-box">

      <li><b>In Falsus의 대사·이름·이미지 등 모든 저작권은 lowiro에 있습니다.</b></li>

    <p class="en">All rights to In Falsus, including its text, names and images, belong to lowiro.
      This is an unofficial fan tool, not affiliated with lowiro.</p>
    <button type="button">확인</button>
  </div>`;
  document.body.appendChild(el);
  const ok = el.querySelector('button');

  ok.focus();
})();
